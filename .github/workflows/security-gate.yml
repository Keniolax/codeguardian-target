name: security-gate

# Blocks a pull request that adds a security finding. Juice Shop is vulnerable by design,
# so the gate judges only what a change adds, against the base commit. Gate code, ignore
# lists and suppressions are always read from the base commit, never from the change.
# This workflow holds no secrets; on a fork pull request its token is read-only.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch: # full scan of main, report only: measures the pre-existing findings

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
  SEMGREP_VERSION: "1.183.0"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af # 2.17.0

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load gate files from the base commit
        run: |
          set -euo pipefail
          if [ "$REPORT_ONLY" = "true" ]; then echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; BASE_SHA=$(git rev-parse HEAD); fi
          git archive "$BASE_SHA" .gate | tar -x -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/.gate/gate.py"
          echo "GATE=$RUNNER_TEMP/.gate" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet "semgrep==${SEMGREP_VERSION}"
      - name: Scan
        run: |
          set -euo pipefail
          args=(--config p/javascript --config p/typescript --config p/nodejsscan
                --disable-nosem --metrics off --json --output "$RUNNER_TEMP/semgrep-raw.json" --timeout 30)
          while read -r pat; do args+=(--exclude "$pat"); done < <(grep -v '^#' "$GATE/semgrep-exclude.txt" | grep .)
          if [ "$REPORT_ONLY" != "true" ]; then args+=(--baseline-commit "$BASE_SHA"); fi
          set +e; semgrep scan "${args[@]}"; rc=$?; set -e
          if [ "$rc" -gt 1 ]; then echo "::error::semgrep exited $rc"; exit 1; fi
          mkdir -p out
          python3 "$GATE/gate.py" normalize-semgrep "$RUNNER_TEMP/semgrep-raw.json" out/semgrep.json
          cp "$RUNNER_TEMP/semgrep-raw.json" out/semgrep-raw.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-semgrep
          path: out/

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load gate files from the base commit
        run: |
          set -euo pipefail
          if [ "$REPORT_ONLY" = "true" ]; then echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; BASE_SHA=$(git rev-parse HEAD); fi
          git archive "$BASE_SHA" .gate | tar -x -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/.gate/gate.py"
          echo "GATE=$RUNNER_TEMP/.gate" >> "$GITHUB_ENV"
      - name: Install gitleaks (checksum pinned)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the commits this change adds
        run: |
          set -euo pipefail
          range="$BASE_SHA..HEAD"
          if [ "$REPORT_ONLY" = "true" ]; then range="HEAD"; fi
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact \
            --config "$GATE/gitleaks.toml" --gitleaks-ignore-path "$GATE/gitleaksignore" \
            --log-opts="$range" --report-format json --report-path "$RUNNER_TEMP/gitleaks-raw.json" \
            --exit-code 2 .
          rc=$?; set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "::error::gitleaks exited $rc"; exit 1; fi
          mkdir -p out
          python3 "$GATE/gate.py" normalize-gitleaks "$RUNNER_TEMP/gitleaks-raw.json" out/gitleaks.json
          cp "$RUNNER_TEMP/gitleaks-raw.json" out/gitleaks-raw.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-gitleaks
          path: out/

  trivy:
    name: trivy (SCA + misconfiguration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load gate files from the base commit
        run: |
          set -euo pipefail
          if [ "$REPORT_ONLY" = "true" ]; then echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; BASE_SHA=$(git rev-parse HEAD); fi
          git archive "$BASE_SHA" .gate | tar -x -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/.gate/gate.py"
          echo "GATE=$RUNNER_TEMP/.gate" >> "$GITHUB_ENV"
      - name: Install trivy (checksum pinned)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
      - name: Scan base and head with the same database
        run: |
          set -euo pipefail
          head="$PWD"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          # Run from RUNNER_TEMP so Trivy never reads a trivy.yaml or .trivyignore from the change.
          cd "$RUNNER_TEMP"
          t=("$RUNNER_TEMP/trivy" fs --quiet --scanners vuln,misconfig --format json
             --cache-dir "$RUNNER_TEMP/trivy-cache" --ignorefile "$GATE/trivyignore")
          "${t[@]}" --output trivy-head.json "$head"
          if [ "$REPORT_ONLY" = "true" ]; then echo '{}' > trivy-base.json
          else "${t[@]}" --skip-db-update --skip-check-update --output trivy-base.json "$RUNNER_TEMP/base"; fi
          mkdir -p "$head/out"
          python3 "$GATE/gate.py" normalize-trivy trivy-head.json trivy-base.json "$head/out/trivy.json"
          cp trivy-head.json "$head/out/trivy-raw.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-trivy
          path: out/

  zap:
    name: zap (DAST baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load gate files from the base commit
        run: |
          set -euo pipefail
          if [ "$REPORT_ONLY" = "true" ]; then echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; BASE_SHA=$(git rev-parse HEAD); fi
          git archive "$BASE_SHA" .gate | tar -x -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/.gate/gate.py"
          echo "GATE=$RUNNER_TEMP/.gate" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app from this change
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cg-target:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the app
        run: |
          set -euo pipefail
          docker run -d --name app -p 3000:3000 cg-target:scan
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 5; done
          curl -sf -o /dev/null http://localhost:3000/ || { docker logs app; exit 1; }
      - name: Passive baseline scan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3000 -m 3 -I -J zap-raw.json
          rc=$?; set -e
          # -I: warnings do not fail the scan. 0 = clean, 2 = warnings; anything else is an error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "::error::zap-baseline exited $rc"; exit 1; fi
          mkdir -p out
          python3 "$GATE/gate.py" normalize-zap "$RUNNER_TEMP/zap/zap-raw.json" out/zap.json
          cp "$RUNNER_TEMP/zap/zap-raw.json" out/zap-raw.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-zap
          path: out/

  gate-tests:
    name: gate unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .gate -v

  gate:
    name: gate
    needs: [semgrep, gitleaks, trivy, zap]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load gate files from the base commit
        run: |
          set -euo pipefail
          if [ "$REPORT_ONLY" = "true" ]; then echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; BASE_SHA=$(git rev-parse HEAD); fi
          git archive "$BASE_SHA" .gate | tar -x -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/.gate/gate.py"
          echo "GATE=$RUNNER_TEMP/.gate" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-*
          merge-multiple: true
          path: scans
      - name: Decide
        run: |
          set -euo pipefail
          git diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/change.diff"
          extra=()
          if [ "$REPORT_ONLY" = "true" ]; then extra+=(--report-only); fi
          python3 "$GATE/gate.py" decide --scans scans --diff "$RUNNER_TEMP/change.diff" \
            --suppressions "$GATE/suppressions.json" --out "$RUNNER_TEMP/decision.json" \
            --summary "$GITHUB_STEP_SUMMARY" "${extra[@]}"
      - name: Refuse changes to scanner config files
        if: always() && env.REPORT_ONLY != 'true'
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- .semgrepignore .gitleaks.toml .gitleaksignore \
            .trivyignore .trivyignore.yaml trivy.yaml .zap)
          if [ -n "$changed" ]; then
            echo "::error::This change edits scanner config files that would change what the scanners see. Edit .gate/ instead, where the change is reviewed."
            exit 1
          fi
      - name: Every scanner job must have run
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; r={k:v["result"] for k,v in json.loads(os.environ["RESULTS"]).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
      - name: Package input for CodeGuardian
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p cg
          cp "$RUNNER_TEMP/decision.json" cg/decision.json
          head -c 200000 "$RUNNER_TEMP/change.diff" > cg/change.diff
          python3 -c 'import json,os; json.dump({"number": int(os.environ["PR_NUMBER"]), "head_sha": os.environ["HEAD_SHA"], "base_sha": os.environ["BASE_SHA"]}, open("cg/pr.json","w"))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: codeguardian-input
          path: cg/
          retention-days: 14
